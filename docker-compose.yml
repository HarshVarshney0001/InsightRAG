version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app                         # <-- local code ko container ke andar map karta hai
    environment:
      - QDRANT_URL=http://qdrant:6333  # <-- container ke andar 'localhost' nahi, service naam use hota hai
    env_file:
      - .env                           # <-- GROQ_API_KEY yahan se aayega
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - qdrant

volumes:
  qdrant_data: